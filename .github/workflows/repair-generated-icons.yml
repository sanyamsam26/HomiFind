name: Repair generated icon imports

on:
  push:
    branches: [architecture-v2]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'repair generated icon imports') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove invalid generated Elevator import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/auth/OnboardingPage.tsx')
          text = path.read_text()
          updated = text.replace('  Elevator,\n', '')
          if updated != text:
              path.write_text(updated)
          PY
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No repair required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/auth/OnboardingPage.tsx
          git commit -m "fix: repair generated icon imports"
          git push
