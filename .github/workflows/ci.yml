name: HomiFind CI

on:
  push:
    branches: [main, develop, architecture-v2]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        id: typecheck
        run: |
          set +e
          bun run lint > typecheck.log 2>&1
          status=$?
          cat typecheck.log
          exit $status
      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-typecheck-${{ github.sha }}
          path: typecheck.log
          if-no-files-found: ignore
      - name: Build frontend
        run: bun run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-springboot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile Spring Boot backend
        run: mvn -B -DskipTests package
