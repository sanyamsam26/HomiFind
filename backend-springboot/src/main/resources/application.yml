server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: homifind-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:homifind}?sslmode=${DB_SSL_MODE:require}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_ISSUER_URI:https://myskqtyhoinngdslgccd.supabase.co/auth/v1}
          jwk-set-uri: ${SUPABASE_JWK_SET_URI:https://myskqtyhoinngdslgccd.supabase.co/auth/v1/.well-known/jwks.json}
          jws-algorithms: ES256

homifind:
  ai:
    function-url: ${HOMIFIND_AI_FUNCTION_URL:}
    internal-token: ${HOMIFIND_AI_INTERNAL_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
